name: ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: build
        run: dotnet build UITestAutomation.sln -c Release
      - name: unit tests
        run: dotnet test UITestAutomation.sln -c Release --no-build
